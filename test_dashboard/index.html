<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🌊 North Sea Fishing Likelihood Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
    --primary:#0066cc;
    --primary-dark:#0052a3;
    --light:#f8f9fa;
    --text:#212529;
    --muted:#6c757d;
    --shadow:0 4px 12px rgba(0,0,0,.15);
}

html, body { height:100%; font-family:system-ui; }

#map { height:100vh; width:100%; }

/* UI */
.header, .control-panel, .legend, .loading {
    position:absolute;
    z-index:500;
    background:white;
    box-shadow:var(--shadow);
    border-radius:12px;
}

.header {
    top:10px; left:10px;
    padding:14px;
    max-width:360px;
}

.control-panel {
    top:120px; left:10px;
    width:360px;
    overflow:hidden;
}

.section-title {
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:white;
    padding:10px 12px;
    font-size:12px;
    font-weight:700;
}

.section-content { padding:12px; }

.layer-item {
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    background:var(--light);
    margin-bottom:6px;
    border-radius:6px;
    cursor:pointer;
    border:2px solid transparent;
}

.layer-item.active {
    border-color:var(--primary);
    background:rgba(0,102,204,0.08);
}

.legend {
    bottom:20px; right:20px;
    padding:14px;
    max-width:260px;
}

/* Add this to your existing CSS */
.hover-panel {
    position: absolute;
    top: 10px;
    right: 10px;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    z-index: 1000;
    width: 260px;
    display: none; /* Hidden until data loads/mouse moves */
    pointer-events: none; /* Let clicks pass through to map */
}

.hover-title {
    font-weight: bold;
    border-bottom: 1px solid #eee;
    padding-bottom: 8px;
    margin-bottom: 8px;
    font-size: 14px;
}

.hover-stat {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 4px;
}

/* Color coding classes */
.val-optimal { color: #198754; font-weight: bold; } /* Green */
.val-suboptimal { color: #dc3545; font-weight: bold; } /* Red */
.val-null { color: var(--muted); }

.loading {
    bottom:20px; left:20px;
    padding:10px 12px;
    display:flex;
    gap:10px;
    align-items:center;
}

.spinner {
    width:14px; height:14px;
    border:2px solid #ddd;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
}

@keyframes spin { to { transform:rotate(360deg);} }

.opacity-slider { width:100%; }
</style>
</head>

<body>

<div id="map"></div>

<div class="header">
    🌊 <b>North Sea Fishing Dashboard</b><br/>
    <small>Environmental layers</small>
</div>

<div class="control-panel">
    <div class="section-title">Layers</div>
    <div class="section-content">
        <div id="layer-list"></div>
    </div>

    <div class="section-title">Opacity</div>
    <div class="section-content">
        <input type="range" id="opacity" min="0" max="1" step="0.1" value="0.7" class="opacity-slider"/>
        <div id="opacity-val">70%</div>
    </div>
</div>

<div class="legend">
    <b>Legend</b>
    <div id="legend">Select layer</div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    Loading layers...
</div>
<div class="hover-panel" id="hover-panel">
    <div class="hover-title">📍 <span id="hover-coords">Hover over map</span></div>
    <div class="hover-stat">🐟 Index Score: <span id="h-index">-</span></div>
    <div class="hover-stat">🌡️ Temperature: <span id="h-temp">-</span></div>
    <div class="hover-stat">💧 Salinity: <span id="h-sal">-</span></div>
    <div class="hover-stat">🌿 Chlorophyll: <span id="h-chl">-</span></div>
    <div class="hover-stat">🌊 Mixed Layer: <span id="h-mld">-</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([55, 3], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

// state
let layers = {};
let activeLayer = null;
let layersConfig = [];

// load config
fetch('data/layers.json')
.then(r => r.json())
.then(cfg => {
    layersConfig = cfg;
    buildLayers();
    document.getElementById("loading").style.display = "none";
})
.catch(() => {
    document.getElementById("loading").innerHTML = "❌ Failed to load data";
});

// build UI + overlays
function buildLayers() {
    const list = document.getElementById("layer-list");

    layersConfig.forEach((c, i) => {

        const overlay = L.imageOverlay(
            `data/${c.dataset}_layer.png`,
            c.bounds,
            { opacity: 0.7 }
        );

        overlay.on("error", () => {
            console.warn("Failed to load:", c.dataset);
        });

        layers[c.dataset] = {
            overlay,
            config: c,
            visible: false,
            z: i
        };

        const div = document.createElement("div");
        div.className = "layer-item";

        const cb = document.createElement("input");
        cb.type = "checkbox";

        const label = document.createElement("span");
        label.textContent = c.label;

        // ONLY one event handler (fix double toggle bug)
        cb.addEventListener("change", () => toggle(c.dataset, cb.checked));
        div.addEventListener("click", (e) => {
            if (e.target !== cb) {
                cb.checked = !cb.checked;
                toggle(c.dataset, cb.checked);
            }
        });

        div.appendChild(cb);
        div.appendChild(label);
        list.appendChild(div);

        layers[c.dataset].ui = div;

        // auto-enable first layer
        if (i === 0) {
            cb.checked = true;
            toggle(c.dataset, true);
        }
    });

    updateLegend();
}

// toggle logic (FIXED)
function toggle(name, on) {
    const layer = layers[name];
    if (!layer) return;

    if (on) {
        layer.overlay.addTo(map);
        layer.overlay.setZIndex(layer.z + 100);
        activeLayer = name;
    } else {
        map.removeLayer(layer.overlay);
        if (activeLayer === name) activeLayer = null;
    }

    layer.ui.classList.toggle("active", on);
    layer.visible = on;

    updateLegend();
}

// opacity sync
document.getElementById("opacity").addEventListener("input", e => {
    const v = parseFloat(e.target.value);
    document.getElementById("opacity-val").textContent = Math.round(v * 100) + "%";

    Object.values(layers).forEach(l => {
        if (l.visible) l.overlay.setOpacity(v);
    });
});

// legend
function updateLegend() {
    const el = document.getElementById("legend");

    if (!activeLayer) {
        el.innerHTML = "No active layer";
        return;
    }

    const c = layers[activeLayer].config;

    el.innerHTML = `
        <div><b>${c.label}</b></div>
        <div style="font-size:12px;color:#666;">
            Range: ${c.min} → ${c.max}
        </div>
    `;
}
</script>
<script>
// ===============================
// COLORMAPS
// ===============================
const colormaps = {
    RdYlBu_r: ['#d73027','#f46d43','#fdae61','#fee08b','#ffffbf','#e0f3f8','#abd9e9','#74add1','#4575b4'],
    Blues: ['#f7fbff','#deebf7','#c6dbef','#9ecae1','#6baed6','#4292c6','#2171b5','#08519c','#08306b'],
    viridis: ['#440154','#472f78','#3b528b','#2c728e','#21918c','#27ad81','#5dc863','#b5de2b','#fde725'],
    YlGn: ['#ffffcc','#f7fcb9','#d9f0a3','#addd8e','#78c679','#41ab5d','#238b45','#005a32'],
    RdYlGn: ['#a50026','#d73027','#f46d43','#fdae61','#fee090','#ffffbf','#abdda4','#66c2a5','#1a9850']
};

function gradient(cmap) {
    const c = colormaps[cmap] || colormaps.viridis;
    return `linear-gradient(to right, ${c.join(',')})`;
}

// ===============================
// MAP
// ===============================
const map = L.map('map').setView([55,3],6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);

// ===============================
// STATE
// ===============================
let layers = {};
let activeLayer = null;
let configData = [];

// ===============================
// LOAD
// ===============================
fetch('data/layers.json')
.then(r => r.json())
.then(cfg => {
    configData = cfg;

    // ADD synthetic fish index layer (IMPORTANT)
    cfg.push({
        dataset: "fish_index",
        label: "🐟 Fish Likelihood Index",
        bounds: cfg[0].bounds,
        cmap: "RdYlGn",
        min: 0,
        max: 100,
        scale: "normalized",
        index_layer: true
    });

    build();
    document.getElementById("loading").style.display = "none";
});

// ===============================
// BUILD LAYERS
// ===============================
function build() {
    const list = document.getElementById("layer-list");

    configData.forEach((c, i) => {

        const overlay = L.imageOverlay(
            `data/${c.dataset}_layer.png`,
            c.bounds,
            { opacity: 0.7 }
        );

        overlay.on("error", () => {
            console.warn("Missing:", c.dataset);
        });

        layers[c.dataset] = {
            overlay,
            config: c,
            visible: false,
            z: i
        };

        const div = document.createElement("div");
        div.className = "layer-item";

        const cb = document.createElement("input");
        cb.type = "checkbox";

        const label = document.createElement("span");
        label.textContent = c.label;

        cb.onchange = () => toggle(c.dataset, cb.checked);

        div.onclick = (e) => {
            if (e.target !== cb) {
                cb.checked = !cb.checked;
                toggle(c.dataset, cb.checked);
            }
        };

        div.appendChild(cb);
        div.appendChild(label);
        list.appendChild(div);

        layers[c.dataset].ui = div;

        if (i === 0) {
            cb.checked = true;
            toggle(c.dataset, true);
        }
    });

    updateLegend();
}

// ===============================
// TOGGLE
// ===============================
function toggle(name, on) {
    const L = layers[name];
    if (!L) return;

    if (on) {
        L.overlay.addTo(map);
        L.overlay.setZIndex(L.z + 100);
        activeLayer = name;
    } else {
        map.removeLayer(L.overlay);
        if (activeLayer === name) activeLayer = null;
    }

    L.ui.classList.toggle("active", on);
    L.visible = on;

    updateLegend();
}

// ===============================
// LEGEND (FIXED COLOR RAMP)
// ===============================
function updateLegend() {
    const el = document.getElementById("legend");

    if (!activeLayer) {
        el.innerHTML = "Select layer";
        return;
    }

    const c = layers[activeLayer].config;

    const isIndex = c.dataset === "fish_index";

    el.innerHTML = `
        <div><b>${c.label}</b></div>

        <div style="margin-top:8px;">
            <div style="height:18px;border-radius:4px;
                background:${gradient(c.cmap)};
                border:1px solid #ddd;"></div>

            <div style="display:flex;justify-content:space-between;
                font-size:11px;color:#666;margin-top:4px;">
                <span>${c.min}</span>
                <span>${c.max}</span>
            </div>

            <div style="font-size:11px;margin-top:6px;color:#999;">
                Scale: ${c.scale || 'physical'}
            </div>

            ${isIndex ? `
                <div style="margin-top:8px;padding-top:6px;
                    border-top:1px solid #eee;font-size:12px;">
                    🐟 Composite index combines:
                    <br/>• Temperature
                    <br/>• Salinity
                    <br/>• Chlorophyll
                    <br/>• Mixed layer depth
                </div>
            ` : ""}
        </div>
    `;
}

// ===============================
// OPACITY
// ===============================
document.getElementById("opacity").addEventListener("input", e => {
    const v = parseFloat(e.target.value);
    document.getElementById("opacity-val").textContent = Math.round(v*100)+"%";

    Object.values(layers).forEach(l => {
        if (l.visible) l.overlay.setOpacity(v);
    });
});
// ===============================
// HOVER INTERACTIVITY
// ===============================
let gridData = null;

// Ideal ranges based on your Python script
const IDEAL = {
    temp: { min: 12, max: 18 },
    salinity: { min: 34.8, max: 35.2 },
    chl: { min: 1, max: 3 },
    mld: { min: 20, max: 80 }
};

// Fetch the raw data grid
fetch('data/hover_data.json')
    .then(r => r.json())
    .then(data => {
        gridData = data;
        document.getElementById("hover-panel").style.display = "block";
    })
    .catch(e => console.warn("Hover data not found. Run the updated Python script."));

// Listen for mouse movement over the map
map.on('mousemove', function(e) {
    if (!gridData) return;

    const lat = e.latlng.lat;
    const lon = e.latlng.lng;

    // Check if mouse is out of bounds
    const minLat = Math.min(...gridData.lats);
    const maxLat = Math.max(...gridData.lats);
    const minLon = Math.min(...gridData.lons);
    const maxLon = Math.max(...gridData.lons);

    if (lat < minLat || lat > maxLat || lon < minLon || lon > maxLon) {
        resetHoverUI();
        return;
    }

    // Find the closest grid indices
    // This maps the physical coordinate to the array row/column
    const latIndex = findClosestIndex(gridData.lats, lat);
    const lonIndex = findClosestIndex(gridData.lons, lon);

    // Update UI
    document.getElementById("hover-coords").innerText = `${Math.abs(lat).toFixed(2)}°${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lon).toFixed(2)}°${lon >= 0 ? 'E' : 'W'}`;

    updateStat("h-index", gridData.data.index[latIndex][lonIndex], "/ 100", null);
    updateStat("h-temp", gridData.data.temp[latIndex][lonIndex], "°C", IDEAL.temp);
    updateStat("h-sal", gridData.data.salinity[latIndex][lonIndex], " PSU", IDEAL.salinity);
    updateStat("h-chl", gridData.data.chl[latIndex][lonIndex], " mg/m³", IDEAL.chl);
    updateStat("h-mld", gridData.data.mld[latIndex][lonIndex], " m", IDEAL.mld);
});

// Helper: Find closest value in a sorted array
function findClosestIndex(arr, target) {
    let closest = 0;
    let minDiff = Infinity;
    for (let i = 0; i < arr.length; i++) {
        let diff = Math.abs(arr[i] - target);
        if (diff < minDiff) {
            minDiff = diff;
            closest = i;
        }
    }
    return closest;
}

// Helper: Update DOM and apply red/green styling
function updateStat(id, value, unit, idealRange) {
    const el = document.getElementById(id);
    if (value === null || value === undefined) {
        el.innerText = "No data";
        el.className = "val-null";
        return;
    }

    el.innerText = value.toFixed(1) + unit;
    
    // Apply styling if ideal range is provided
    if (idealRange) {
        if (value >= idealRange.min && value <= idealRange.max) {
            el.className = "val-optimal";
        } else {
            el.className = "val-suboptimal";
        }
    } else {
        // Special case for the overall Index (no strict range, just higher is greener)
        el.className = value >= 70 ? "val-optimal" : (value < 40 ? "val-suboptimal" : "");
    }
}

function resetHoverUI() {
    document.getElementById("hover-coords").innerText = "Out of bounds";
    ["h-index", "h-temp", "h-sal", "h-chl", "h-mld"].forEach(id => {
        const el = document.getElementById(id);
        el.innerText = "-";
        el.className = "";
    });
}
</script>
</body>
</html>
